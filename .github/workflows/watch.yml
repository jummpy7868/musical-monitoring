name: 抓取售票資料

on:
  schedule:
    # UTC 01:00 / 13:00 = 台灣時間 09:00 / 21:00
    - cron: "0 1,13 * * *"
  workflow_dispatch: # 也可以在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 自我檢查
        run: node test.js

      - name: 抓取並推播
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BOARD_URL: ${{ vars.BOARD_URL }}
        run: node fetch.js

      - name: 有變動才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "資料更新 $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)"
          git push
